name: CI Node.js

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Generate test coverage report
        run: npm test -- --coverage

      - name: Upload test results artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: coverage/
